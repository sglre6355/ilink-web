name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # FFmpeg and libclang for the `gpu` feature.
      - run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavutil-dev libclang-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --no-default-features
      - run: cargo test
