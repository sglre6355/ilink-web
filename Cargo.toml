[package]
name = "ilink-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Web page to watch and steer an Insta360 Link series webcam (unofficial)"
repository = "https://github.com/sglre6355/ilink-web"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
insta360-link = { version = "0.1.0", git = "https://github.com/sglre6355/insta360-link" }
linuxvideo = "0.3"
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
openh264 = "0.9"
openh264-sys2 = "0.9"
zune-jpeg = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec"], optional = true }

[features]
default = ["gpu"]
# Encode on the GPU through FFmpeg, with Vulkan Video or VA-API, when one works.
gpu = ["dep:ffmpeg-sys-next"]
